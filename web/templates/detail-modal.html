{{define "detail-modal"}}
<!-- 两个统计页共用的明细弹窗：数据来自 /api/target-detail 或 /api/sourceip-detail，
     一行是 客户端/目标 × 线路 × 规则 的一个组合；表格复用共享的 table 模板 -->
<dialog x-ref="detailModal" class="modal" @close="detail.loading = false; detail.error = null">
    <div class="modal-box modal-box-wide max-h-[85vh] flex flex-col gap-4">
        <div class="flex items-start justify-between gap-4">
            <div class="min-w-0">
                <h3 class="font-semibold break-all" x-text="detail.data ? detail.data.Name : ''"></h3>
                <p class="text-sm opacity-70" x-text="detail.data ? detail.data.Subtitle : ''"></p>
                <!-- 拆分开关：默认只按单一维度，打开后才把线路/规则加进来 -->
                <div class="mt-3 flex flex-wrap items-center gap-x-5 gap-y-2">
                    <label class="inline-flex cursor-pointer items-center gap-2">
                        <input type="checkbox" class="toggle toggle-sm toggle-primary"
                               :checked="splitChain"
                               @change="splitChain = $event.target.checked; toggleSplit()" />
                        <span class="text-xs">按线路拆分</span>
                    </label>
                    <label class="inline-flex cursor-pointer items-center gap-2">
                        <input type="checkbox" class="toggle toggle-sm toggle-primary"
                               :checked="splitRule"
                               @change="splitRule = $event.target.checked; toggleSplit()" />
                        <span class="text-xs">按规则拆分</span>
                    </label>
                    <label class="inline-flex items-center gap-2">
                        <span class="text-xs opacity-70">搜索</span>
                        <input type="text" x-model="detailTable.search" @input="detailTable.onSearchInput()"
                               class="input input-xs w-36" />
                    </label>
                </div>
            </div>
            <form method="dialog">
                <button type="submit" class="btn btn-sm btn-circle btn-ghost" aria-label="关闭">✕</button>
            </form>
        </div>

        <div x-show="detail.loading" class="flex justify-center py-6">
            <span class="loading loading-spinner loading-lg"></span>
        </div>

        <div x-show="detail.error" class="alert alert-error" x-cloak>
            <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span x-text="detail.error"></span>
        </div>

        <div x-show="!detail.loading && !detail.error" class="overflow-auto" x-cloak>
            <div x-show="detailTable.rows.length === 0" class="text-sm opacity-60" x-text="detailTable.search ? '没有匹配的明细' : '暂无数据'"></div>
            <div x-show="detailTable.rows.length > 0" x-data="{ tbl: detailTable }">
                {{template "table-hint" .}}
                <div class="rounded-lg border border-base-300">
                    <table class="table table-sm table-pin-rows w-full min-w-[1000px]">
                        {{template "table-head" .}}
                        <tbody>
                            <template x-for="(row, rowIndex) in tbl.rows" :key="rowIndex">
                                <tr class="row-hover">
                                    <td class="break-all font-medium" x-text="row.Key"></td>
                                    <!-- 拆分开关打开时才出现这两列：直接放在 tr 里，
                                         不像通用模板那样需要给每个单元格加包装元素 -->
                                    <template x-if="detail.data && detail.data.SplitChain">
                                        <td class="break-all text-xs opacity-80" x-text="row.Chain"></td>
                                    </template>
                                    <template x-if="detail.data && detail.data.SplitRule">
                                        <td class="break-all text-xs opacity-80" x-text="row.Rule"></td>
                                    </template>
                                    <td class="text-right tabular-nums" x-text="formatBytes(row.Download)"></td>
                                    <td class="text-right tabular-nums" x-text="formatBytes(row.Upload)"></td>
                                    <td class="text-right tabular-nums font-semibold" x-text="formatBytes(row.Total)"></td>
                                    <td class="text-right tabular-nums" x-text="row.Connections"></td>
                                    <td class="text-right tabular-nums whitespace-nowrap" x-text="formatTime(row.FirstSeen)"></td>
                                    <td class="text-right tabular-nums whitespace-nowrap" x-text="formatTime(row.LastSeen)"></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="modal-action">
            <form method="dialog">
                <button type="submit" class="btn btn-sm">关闭</button>
            </form>
        </div>
    </div>
</dialog>
{{end}}
