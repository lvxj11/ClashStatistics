{{define "content"}}
<div x-data="onlineTime()" x-init="loadGanttChart()">
    <div class="mb-6 flex flex-wrap items-center gap-4">
        <label for="date" class="font-medium">选择日期:</label>
        <input type="date" id="date" x-model="selectedDate" @change="loadGanttChart()" class="input w-auto" />
        <div class="text-sm opacity-70">
            <span class="font-medium">时区:</span>
            <span>{{.TimeZoneOffset}}</span>
            <span class="text-xs ml-1">({{.TimeZoneName}})</span>
        </div>
        
        <div class="ml-auto flex flex-wrap items-center gap-3 text-xs opacity-70">
            <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded-sm bg-info/60"></span>1-2</span>
            <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded-sm bg-info"></span>3-20</span>
            <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded-sm bg-success"></span>21-50</span>
            <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded-sm bg-warning"></span>51-150</span>
            <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded-sm bg-error/80"></span>151-254</span>
            <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded-sm bg-error"></span>255+</span>
            <span class="opacity-60">单位：连接数</span>
        </div>
    </div>
    
    <div x-show="loading" class="flex justify-center py-8">
        <span class="loading loading-spinner loading-lg"></span>
    </div>
    
    <div x-show="error" class="alert alert-error" x-cloak>
        <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span x-text="error"></span>
    </div>
    
    <div x-show="!loading && !error" class="overflow-x-auto" x-cloak>
        <div class="font-mono leading-relaxed space-y-2">
            <!-- 时间轴 -->
            <div class="flex items-center sticky top-0 bg-base-100 z-10">
                <div class="w-[200px] flex-shrink-0"></div>
                <div class="flex-1 relative min-w-[600px]">
                    <!-- 时间轴背景线 -->
                    <div class="absolute inset-0 flex items-center">
                        <div class="h-px bg-base-content/20 w-full"></div>
                    </div>
                    <!-- 小时标记 -->
                    <div class="relative flex w-full">
                        <template x-for="hour in 24" :key="hour">
                            <div class="flex flex-col items-start flex-shrink-0" :style="{ width: (100 / 24) + '%' }">
                                <div class="text-xs font-medium opacity-70 mb-1" x-text="formatHour(hour - 1)"></div>
                                <div class="w-px h-2 bg-base-content/30"></div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
            
            <!-- 虚拟滚动容器 -->
            <div x-ref="viewport" class="relative h-[600px] max-h-[70vh] overflow-y-auto" @scroll="handleScroll" @resize.window="syncViewportHeight">
                <!-- 占位容器，用于撑开滚动条 -->
                <div :style="{ height: (ganttData.length * 24) + 'px' }"></div>
                
                <!-- 可见区域 -->
                <div class="absolute top-0 left-0 right-0" :style="{ transform: `translateY(${visibleStartIndex * 24}px)` }">
                    <template x-for="(item, index) in visibleItems" :key="item.SourceIP">
                        <div class="flex items-center" style="height: 24px;">
                            <div class="w-[200px] overflow-hidden text-ellipsis whitespace-nowrap flex-shrink-0 font-medium" 
                                 x-text="item.SourceIP || 'Unknown'" 
                                 :title="item.SourceIP || 'Unknown'"></div>
                            <div class="flex-1 min-w-[600px] h-4 bg-base-300 rounded-full overflow-hidden relative group">
                                <!-- 连续的活动时间段 -->
                                <div class="absolute inset-0 flex">
                                    <template x-for="(slot, slotIndex) in 288" :key="slotIndex">
                                        <div class="flex-1 h-full" 
                                             :class="getSlotColor(item.TimeSlots[slotIndex])"></div>
                                    </template>
                                </div>
                                <!-- 悬停提示 -->
                                <div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity bg-base-100/90 backdrop-blur-sm flex items-center justify-center text-base-content text-xs rounded-full"
                                     x-text="item.activeTimeText"></div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>
    
    <div x-show="!loading && !error && ganttData.length === 0" class="text-center py-8" x-cloak>
        <div class="alert">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="stroke-info shrink-0 w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span>暂无数据</span>
        </div>
    </div>
</div>

<script>
    function onlineTime() {
        return {
            ganttData: [],
            selectedDate: '{{.CurrentDate}}',
            loading: true,
            error: null,
            visibleStartIndex: 0,
            visibleEndIndex: 0,
            visibleItems: [],
            rowHeight: 24,
            containerHeight: 600,
            loadGanttChart() {
                this.loading = true;
                this.error = null;
                this.visibleItems = [];
                fetch('/api/gantt?date=' + this.selectedDate)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('HTTP error! status: ' + response.status);
                        }
                        return response.json();
                    })
                    .then(data => {
                        this.ganttData = data || [];
                        this.processData();
                        this.visibleStartIndex = 0;
                        this.visibleEndIndex = Math.min(
                            Math.ceil(this.containerHeight / this.rowHeight) + 5,
                            this.ganttData.length
                        );
                        this.updateVisibleItems();
                        this.loading = false;
                        // 容器高度要到 DOM 更新后才量得准
                        this.$nextTick(() => this.syncViewportHeight());
                    })
                    .catch(error => {
                        console.error('加载甘特图失败:', error);
                        this.error = '加载甘特图失败: ' + error.message;
                        this.loading = false;
                    });
            },
            processData() {
                if (!this.ganttData || this.ganttData.length === 0) return;
                this.ganttData.forEach(item => {
                    item.activeTimeText = this.getActiveTime(item.TimeSlots);
                });
            },
            handleScroll(event) {
                const scrollTop = event.target.scrollTop;
                this.visibleStartIndex = Math.floor(scrollTop / this.rowHeight);
                this.visibleEndIndex = Math.min(
                    this.visibleStartIndex + Math.ceil(this.containerHeight / this.rowHeight) + 5,
                    this.ganttData.length
                );
                this.updateVisibleItems();
            },
            updateVisibleItems() {
                this.visibleItems = this.ganttData.slice(this.visibleStartIndex, this.visibleEndIndex);
            },
            formatHour(hour) {
                return String(hour).padStart(2, '0');
            },
            getActiveTime(timeSlots) {
                const activeSlots = timeSlots.filter(slot => slot > 0).length;
                const activeMinutes = activeSlots * 5;
                const hours = Math.floor(activeMinutes / 60);
                const minutes = activeMinutes % 60;
                const maxConnections = Math.max(...timeSlots);
                const maxConnectionsText = maxConnections === 255 ? '255+' : maxConnections;
                return `在线时间: ${hours}h ${minutes}m, 最大连接数: ${maxConnectionsText}`;
            },
            getSlotColor(connectionCount) {
                // 返回值必须是模板里能扫到的完整字面量类名，字符串拼出来的类不会进 CSS
                if (connectionCount === 0) return 'bg-transparent';
                if (connectionCount <= 2) return 'bg-info/60';
                if (connectionCount <= 20) return 'bg-info';
                if (connectionCount <= 50) return 'bg-success';
                if (connectionCount <= 150) return 'bg-warning';
                if (connectionCount <= 254) return 'bg-error/80';
                return 'bg-error';
            },
            // 容器高度随视口变化（max-h-[70vh]），虚拟滚动窗口要跟着同步
            syncViewportHeight() {
                const el = this.$refs.viewport;
                const h = el ? el.clientHeight : 0;
                if (h > 0 && h !== this.containerHeight) {
                    this.containerHeight = h;
                }
                this.updateVisibleItems();
            }
        }
    }
</script>
{{end}}
