{{define "content"}}
<div x-data="onlineTime()" x-init="loadGanttChart()">
    <h2 class="text-2xl font-bold mb-6">SourceIP 在线时间</h2>
    
    <div class="mb-6 flex flex-wrap items-center gap-4">
        <label for="date" class="font-medium">选择日期:</label>
        <input type="date" id="date" x-model="selectedDate" @change="loadGanttChart()" class="input input-bordered w-auto" />
        <div class="text-sm text-gray-600">
            <span class="font-medium">时区:</span>
            <span>{{.TimeZoneOffset}}</span>
            <span class="text-xs ml-1">({{.TimeZoneName}})</span>
        </div>
    </div>
    
    <div x-show="loading" class="flex justify-center py-8">
        <span class="loading loading-spinner loading-lg"></span>
    </div>
    
    <div x-show="error" class="alert alert-error" x-cloak>
        <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span x-text="error"></span>
    </div>
    
    <div x-show="!loading && !error" class="overflow-x-auto" x-cloak>
        <div class="gantt-container space-y-2">
            <!-- 时间轴 -->
            <div class="flex items-center">
                <div class="w-[200px] flex-shrink-0"></div>
                <div class="flex-1 relative">
                    <!-- 时间轴背景线 -->
                    <div class="absolute inset-0 flex items-center">
                        <div class="h-px bg-gray-600 w-full"></div>
                    </div>
                    <!-- 小时标记 -->
                    <div class="relative flex w-full">
                        <template x-for="hour in 24" :key="hour">
                            <div class="flex flex-col items-start flex-shrink-0" :style="{ width: (100 / 24) + '%' }">
                                <div class="text-xs font-medium text-gray-600 mb-1" x-text="formatHour(hour - 1)"></div>
                                <div class="w-px h-2 bg-gray-500"></div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
            
            <!-- 甘特图条目 -->
            <template x-for="(item, itemIndex) in ganttData" :key="itemIndex">
                <div class="flex items-center">
                    <div class="w-[200px] overflow-hidden text-ellipsis whitespace-nowrap flex-shrink-0 font-medium" 
                         x-text="item.SourceIP || 'Unknown'" 
                         :title="item.SourceIP || 'Unknown'"></div>
                    <div class="flex-1 h-4 bg-gray-800 rounded-full overflow-hidden relative group">
                        <!-- 连续的活动时间段 -->
                        <div class="absolute inset-0 flex">
                            <template x-for="(slot, slotIndex) in 144" :key="slotIndex">
                                <div class="flex-1 h-full" 
                                     :class="slotIndex < item.TimeSlots.length && item.TimeSlots[slotIndex] ? 'bg-green-500' : 'bg-transparent'"></div>
                            </template>
                        </div>
                        <!-- 悬停提示 -->
                        <div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity bg-black bg-opacity-50 flex items-center justify-center text-white text-xs rounded-full"
                             x-text="getActiveTime(item.TimeSlots)"></div>
                    </div>
                </div>
            </template>
        </div>
    </div>
    
    <div x-show="!loading && !error && ganttData.length === 0" class="text-center py-8" x-cloak>
        <div class="alert">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="stroke-info shrink-0 w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span>暂无数据</span>
        </div>
    </div>
</div>

<script>
    function onlineTime() {
        return {
            ganttData: [],
            selectedDate: '{{.CurrentDate}}',
            loading: true,
            error: null,
            loadGanttChart() {
                this.loading = true;
                this.error = null;
                fetch('/api/gantt?date=' + this.selectedDate)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('HTTP error! status: ' + response.status);
                        }
                        return response.json();
                    })
                    .then(data => {
                        this.ganttData = data;
                        this.loading = false;
                    })
                    .catch(error => {
                        console.error('加载甘特图失败:', error);
                        this.error = '加载甘特图失败: ' + error.message;
                        this.loading = false;
                    });
            },
            formatHour(hour) {
                return String(hour).padStart(2, '0') + ':00';
            },
            getActiveTime(timeSlots) {
                const activeSlots = timeSlots.filter(slot => slot).length;
                const activeMinutes = activeSlots * 10;
                const hours = Math.floor(activeMinutes / 60);
                const minutes = activeMinutes % 60;
                return `在线时间: ${hours}h ${minutes}m`;
            }
        }
    }
</script>
{{end}}
