<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>{{.Title}} - Clash Statistics Dashboard</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 样式与脚本全部本地提供，不依赖 CDN，断网也能正常显示 -->
    <link href="/static/app.css" rel="stylesheet" type="text/css" />
    <script>
        /* 必须在 <head> 里同步执行：赶在首次绘制前定好主题，否则会闪一下浅色 */
        (function () {
            var KEY = 'clash-theme';
            var root = document.documentElement;
            var mq = window.matchMedia('(prefers-color-scheme: dark)');

            function read() {
                try { return localStorage.getItem(KEY); } catch (e) { return null; }
            }
            function save(t) {
                try { localStorage.setItem(KEY, t); } catch (e) {}
            }
            function apply(t) {
                root.dataset.theme = t;
                root.style.colorScheme = t;
            }
            function stored() {
                var t = read();
                return t === 'light' || t === 'dark' ? t : null;
            }

            apply(stored() || (mq.matches ? 'dark' : 'light'));

            /* 没有显式选择过时跟随系统偏好变化 */
            mq.addEventListener('change', function (e) {
                if (!stored()) apply(e.matches ? 'dark' : 'light');
            });

            window.__setTheme = function (t) { apply(t); save(t); };
            window.__toggleTheme = function () {
                var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
                apply(next); save(next);
            };
        })();
    </script>
    <script defer src="/static/alpine.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        
        .page-transition {
            animation: fadeIn 0.3s ease-in-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="min-h-screen flex flex-col">
        <div class="navbar min-h-16 px-4 border-b border-base-300 bg-base-100">
            <div class="navbar-start gap-3">
                <img src="/favicon.svg" alt="" class="h-8 w-8 flex-shrink-0" />
                <a href="/" class="btn btn-ghost px-2 text-lg normal-case">
                    Clash <span class="text-primary font-semibold">Statistics</span> Dashboard
                </a>
                <span class="badge badge-outline badge-sm font-mono">v{{.Version}}</span>
            </div>
            <div class="navbar-end gap-3">
                <!-- 服务端时区：所有页面的时间都按它解释，放在这里比塞进页面工具栏更清静 -->
                <span class="hidden sm:inline-flex items-baseline gap-1 text-xs opacity-60" title="服务端时区">
                    <span>时区</span>
                    <span>{{.TimeZoneName}}</span>
                    <span class="font-mono">({{.TimeZoneOffset}})</span>
                </span>
                <button type="button" class="btn btn-ghost btn-circle" onclick="window.__toggleTheme()"
                        aria-label="切换主题" title="切换深/浅色主题">
                    <svg xmlns="http://www.w3.org/2000/svg" class="hidden dark:block h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.364-6.364l-1.414 1.414M7.05 17.364l-1.414 1.414m12.728 0l-1.414-1.414M7.05 6.636L5.636 5.222" />
                    </svg>
                    <svg xmlns="http://www.w3.org/2000/svg" class="dark:hidden h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>
            </div>
        </div>
        
        <!-- 标签栏与内容放进同一张卡片，避免"标签是一块、表格是另一块"的割裂感 -->
        <div class="flex-1 w-full max-w-[1920px] mx-auto px-4 pt-4 md:px-6 md:pt-6 flex flex-col">
            <div class="flex-1 flex flex-col bg-base-100 border border-base-300 rounded-box">
                <div class="tabs tabs-border px-3 pt-2 bg-base-200/40 rounded-t-box">
                    <a href="/host-stats" title="按访问的目标（域名/IP）聚合，点开看每个客户端与线路的用量"
                       class="tab {{if eq .CurrentPage "host-stats"}}tab-active{{end}}">
                        目标统计
                    </a>
                    <a href="/sourceip-stats" title="按客户端（源IP）聚合，点开看它访问了哪些目标"
                       class="tab {{if eq .CurrentPage "sourceip-stats"}}tab-active{{end}}">
                        客户端统计
                    </a>
                    <a href="/online-time" title="按天展示每个客户端的在线状态（由存活连接体现）"
                       class="tab {{if eq .CurrentPage "online-time"}}tab-active{{end}}">
                        在线状态
                    </a>
                </div>
                
                <main class="flex-1 p-4 md:p-6 page-transition">
                    {{template "content" .}}
                </main>
            </div>
        </div>
        
        <footer class="footer footer-center p-4 text-base-content">
            <aside>
                <p>Clash Statistics Dashboard &copy; {{.CurrentYear}}</p>
            </aside>
        </footer>
    </div>
    
    <script>
        function formatBytes(bytes) {
            const unit = 1024;
            if (bytes < unit) {
                return bytes + ' B';
            }
            const units = ['B', 'KB', 'MB', 'GB', 'TB'];
            let exp = Math.min(Math.floor(Math.log(bytes) / Math.log(unit)), units.length-1);
            const size = bytes / Math.pow(unit, exp);
            return size.toFixed(2) + ' ' + units[exp];
        }
        
        // 时间戳（Unix 秒）转成本地时间的 MM-DD HH:mm；0 表示未知
        function formatTime(timestamp) {
            if (!timestamp) {
                return '-';
            }
            const d = new Date(timestamp * 1000);
            const pad = n => String(n).padStart(2, '0');
            return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }
        
        // 表格的公共状态与行为：两个统计页的主表与弹窗的明细表共用同一份
        // 表格模板，各自只提供列定义与"怎么重新取数"
        //
        // config: { columns, minWidth, sort, reload(), onRowClick(item) }
        // 搜索与排序都发回服务端（有行数上限，只有服务端筛选才搜得全）
        function makeTable(config) {
            return {
                columns: config.columns,
                minWidth: config.minWidth || '',
                rows: [],
                total: 0,
                truncated: false,
                search: '',
                sortBy: config.sort || 'total',
                sortOrder: 'desc',
                searchTimer: null,
                onRowClick: config.onRowClick || null,

                // 输入停顿 300ms 才请求，避免每敲一个字符发一次
                onSearchInput() {
                    clearTimeout(this.searchTimer);
                    this.searchTimer = setTimeout(() => config.reload(), 300);
                },
                clearSearch() {
                    this.search = '';
                    config.reload();
                },
                toggleSort(column) {
                    if (!column) {
                        return;
                    }
                    if (this.sortBy === column) {
                        this.sortOrder = this.sortOrder === 'desc' ? 'asc' : 'desc';
                    } else {
                        this.sortBy = column;
                        this.sortOrder = 'desc';
                    }
                    config.reload();
                },
                sortIcon(column) {
                    if (this.sortBy !== column) {
                        return '';
                    }
                    return this.sortOrder === 'desc' ? '▼' : '▲';
                },
                appendParams(params) {
                    if (this.search) {
                        params.append('q', this.search);
                    }
                    if (this.sortBy) {
                        params.append('sort', this.sortBy);
                    }
                    params.append('order', this.sortOrder);
                    return params;
                },
                applyResult(data) {
                    this.rows = data.Rows || [];
                    this.total = data.Total || 0;
                    this.truncated = !!data.Truncated;
                }
            };
        }

        // 单元格文本：按列的 format 决定怎么显示
        function cellText(col, item, index) {
            if (col.format === 'rank') {
                return index + 1;
            }
            const value = item[col.key];
            if (col.format === 'bytes') {
                return formatBytes(value);
            }
            if (col.format === 'time') {
                return formatTime(value);
            }
            return value;
        }

        // 单元格类名：对齐、等宽数字、前三名强调等
        function cellClass(col, item, index) {
            const classes = [];
            if (col.format === 'rank') {
                classes.push('text-center');
                classes.push(index < 3 ? 'font-bold text-primary' : 'opacity-60');
            }
            if (col.format === 'action') {
                classes.push('text-center');
            }
            if (col.align === 'right') {
                classes.push('text-right');
            }
            if (col.format === 'bytes' || col.format === 'number' || col.format === 'time') {
                classes.push('tabular-nums');
            }
            if (col.format === 'time') {
                classes.push('whitespace-nowrap');
            }
            if (col.strong) {
                classes.push('font-semibold');
            }
            return classes.join(' ');
        }

        // 明细弹窗的公共状态与行为：两个统计页共用同一份弹窗模板，
        // kind 决定打哪个接口、用哪个查询参数名
        function detailState(kind) {
            const endpoint = kind === 'target' ? '/api/target-detail' : '/api/sourceip-detail';
            const param = kind === 'target' ? 'target' : 'ip';
            return {
                detail: { loading: false, error: null, data: null },
                detailName: '',
                detailTable: null,
                // 默认只按单一维度聚合，线路与规则由弹窗里的开关控制
                splitChain: false,
                splitRule: false,
                // 注意：不能叫 init()。页面组件也是 x-data 的一部分，两边同名的话
                // Object.assign 会互相覆盖，页面的初始化就跑不到了
                initDetail() {
                    const self = this;
                    this.detailTable = makeTable({
                        minWidth: 'min-w-[1000px]',
                        columns: [], // 拿到数据后按 KeyLabel 与拆分开关重建
                        reload: () => self.fetchDetail()
                    });
                },
                openDetail(name) {
                    this.detailName = name;
                    this.splitChain = false;
                    this.splitRule = false;
                    this.detailTable.search = '';
                    this.fetchDetail();
                },
                toggleSplit() {
                    if (this.detailName) {
                        this.fetchDetail();
                    }
                },
                fetchDetail() {
                    this.detail = { loading: true, error: null, data: null };
                    if (this.$refs.detailModal && !this.$refs.detailModal.open) {
                        this.$refs.detailModal.showModal();
                    }
                    const params = new URLSearchParams();
                    params.append(param, this.detailName);
                    if (this.splitChain) {
                        params.append('splitChain', '1');
                    }
                    if (this.splitRule) {
                        params.append('splitRule', '1');
                    }
                    if (this.startTime) {
                        params.append('startTime', this.startTime);
                    }
                    if (this.endTime) {
                        params.append('endTime', this.endTime);
                    }
                    fetch(endpoint + '?' + this.detailTable.appendParams(params).toString())
                        .then(response => response.json())
                        .then(data => {
                            this.detail = { loading: false, error: null, data: data };
                            this.detailTable.columns = this.buildDetailColumns(data);
                            this.detailTable.applyResult(data);
                        })
                        .catch(error => {
                            this.detail = { loading: false, error: '加载明细失败: ' + error.message, data: null };
                        });
                },
                closeDetail() {
                    if (this.$refs.detailModal) {
                        this.$refs.detailModal.close();
                    }
                },
                // 明细的列随 KeyLabel 与拆分开关变化，每次拿到数据后重建
                buildDetailColumns(data) {
                    const columns = [{ key: 'Key', label: data.KeyLabel || '名称', sort: 'key', format: 'text' }];
                    if (data.SplitChain) {
                        columns.push({ key: 'Chain', label: '线路', format: 'text' });
                    }
                    if (data.SplitRule) {
                        columns.push({ key: 'Rule', label: '规则', format: 'text' });
                    }
                    columns.push(
                        { key: 'Download', label: '下载量', sort: 'download', align: 'right', format: 'bytes' },
                        { key: 'Upload', label: '上传量', sort: 'upload', align: 'right', format: 'bytes' },
                        { key: 'Total', label: '总计', sort: 'total', align: 'right', format: 'bytes', strong: true },
                        { key: 'Connections', label: '连接数', sort: 'connections', align: 'right', format: 'number' },
                        { key: 'FirstSeen', label: '首次访问', sort: 'first', align: 'right', format: 'time' },
                        { key: 'LastSeen', label: '最近访问', sort: 'last', align: 'right', format: 'time' }
                    );
                    return columns;
                }
            };
        }
    </script>
</body>
</html>
