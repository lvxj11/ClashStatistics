{{define "content"}}
<div x-data="Object.assign(hostStats(), detailState('target'))">
    <div x-show="loading" class="flex justify-center py-8">
        <span class="loading loading-spinner loading-lg"></span>
    </div>

    <div x-show="error" class="alert alert-error" x-cloak>
        <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span x-text="error"></span>
    </div>

    <div x-show="!loading && !error" x-cloak>
        <!-- 筛选区域：只保留时间与搜索，客户端/线路维度下钻到明细里看 -->
        <div class="mb-4 flex flex-wrap items-end gap-x-5 gap-y-3">
            <div class="flex flex-col gap-1">
                <span class="text-xs font-medium opacity-70">起始时间</span>
                <input type="datetime-local" x-model="startTime" @change="loadStats()" class="input input-sm w-auto" step="60">
            </div>
            <div class="flex flex-col gap-1">
                <span class="text-xs font-medium opacity-70">结束时间</span>
                <input type="datetime-local" x-model="endTime" @change="loadStats()" class="input input-sm w-auto" step="60">
            </div>
            <div class="flex flex-col gap-1">
                <span class="text-xs font-medium opacity-70">搜索目标</span>
                <input type="text" x-model="mainTable.search" @input="mainTable.onSearchInput()" placeholder="域名或 IP 片段"
                       class="input input-sm w-48">
            </div>
            <button x-show="startTime || endTime" @click="clearFilters" class="btn btn-sm btn-outline">
                清除筛选
            </button>
        </div>

        <div x-data="{ tbl: mainTable }">
            {{template "table-hint" .}}
            <div class="overflow-auto rounded-lg border border-base-300">
                <table class="table table-zebra table-pin-rows w-full min-w-[980px]">
                    {{template "table-head" .}}
                    <tbody>
                        <template x-for="(item, index) in tbl.rows" :key="item.Target || index">
                            <tr class="row-hover cursor-pointer" @click="tbl.onRowClick(item)">
                                <td class="w-16 text-center" :class="index < 3 ? 'font-bold text-primary' : 'opacity-60'" x-text="index + 1"></td>
                                <td class="break-all font-medium" x-text="item.Target"></td>
                                <td class="text-right tabular-nums" x-text="item.Connections"></td>
                                <td class="text-right tabular-nums" x-text="item.Peers"></td>
                                <td class="text-right tabular-nums" x-text="item.Chains"></td>
                                <td class="text-right tabular-nums" x-text="formatBytes(item.Download)"></td>
                                <td class="text-right tabular-nums" x-text="formatBytes(item.Upload)"></td>
                                <td class="text-right tabular-nums font-semibold" x-text="formatBytes(item.Total)"></td>
                                <td class="text-right tabular-nums whitespace-nowrap" x-text="formatTime(item.LastSeen)"></td>
                                <td class="w-20 text-center">
                                    <button type="button" class="btn btn-xs btn-ghost" @click.stop="tbl.onRowClick(item)">详情</button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div x-show="!loading && !error && mainTable.rows.length === 0" class="text-center py-8" x-cloak>
        <div class="alert">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="stroke-info shrink-0 w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span x-text="mainTable.search ? '没有匹配的目标' : '暂无数据'"></span>
        </div>
    </div>

    {{template "detail-modal" .}}
</div>

<script>
    function hostStats() {
        return makeStatsPage({
            endpoint: '/api/stats',
            logLabel: '目标统计',
            minWidth: 'min-w-[980px]',
            columns: [
                { key: 'rank', label: '排名', width: 'w-16' },
                { key: 'Target', label: '目标', sort: 'target' },
                { key: 'Connections', label: '连接数', sort: 'connections', align: 'right' },
                { key: 'Peers', label: '客户端数', sort: 'peers', align: 'right' },
                { key: 'Chains', label: '线路数', align: 'right' },
                { key: 'Download', label: '下载量', sort: 'download', align: 'right' },
                { key: 'Upload', label: '上传量', sort: 'upload', align: 'right' },
                { key: 'Total', label: '总计', sort: 'total', align: 'right' },
                { key: 'LastSeen', label: '最近访问', sort: 'last', align: 'right' },
                { key: 'action', label: '明细', width: 'w-20' }
            ]
        });
    }
</script>
{{end}}
