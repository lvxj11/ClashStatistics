{{define "content"}}
<div x-data="Object.assign(hostStats(), detailState('target'))">
    <div x-show="loading" class="flex justify-center py-8">
        <span class="loading loading-spinner loading-lg"></span>
    </div>

    <div x-show="error" class="alert alert-error" x-cloak>
        <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span x-text="error"></span>
    </div>

    <div x-show="!loading && !error" x-cloak>
        <!-- 筛选区域：只保留时间与搜索，客户端/线路维度下钻到明细里看 -->
        <div class="mb-4 flex flex-wrap items-end gap-x-5 gap-y-3">
            <div class="flex flex-col gap-1">
                <span class="text-xs font-medium opacity-70">起始时间</span>
                <input type="datetime-local" x-model="startTime" @change="loadStats()" class="input input-sm w-auto" step="60">
            </div>
            <div class="flex flex-col gap-1">
                <span class="text-xs font-medium opacity-70">结束时间</span>
                <input type="datetime-local" x-model="endTime" @change="loadStats()" class="input input-sm w-auto" step="60">
            </div>
            <div class="flex flex-col gap-1">
                <span class="text-xs font-medium opacity-70">搜索目标</span>
                <input type="text" x-model="mainTable.search" @input="mainTable.onSearchInput()" placeholder="域名或 IP 片段"
                       class="input input-sm w-48">
            </div>
            <button x-show="startTime || endTime" @click="clearFilters" class="btn btn-sm btn-outline">
                清除筛选
            </button>
        </div>

        <div x-data="{ tbl: mainTable }">{{template "table" .}}</div>
    </div>

    <div x-show="!loading && !error && mainTable.rows.length === 0" class="text-center py-8" x-cloak>
        <div class="alert">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="stroke-info shrink-0 w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span x-text="mainTable.search ? '没有匹配的目标' : '暂无数据'"></span>
        </div>
    </div>

    {{template "detail-modal" .}}
</div>

<script>
    function hostStats() {
        return {
            mainTable: null,
            loading: true,
            error: null,
            startTime: '',
            endTime: '',

            init() {
                const self = this;
                this.initDetail();
                this.mainTable = makeTable({
                    minWidth: 'min-w-[980px]',
                    columns: [
                        { key: 'rank', label: '排名', format: 'rank', width: 'w-16' },
                        { key: 'Target', label: '目标', sort: 'target', format: 'text' },
                        { key: 'Connections', label: '连接数', sort: 'connections', align: 'right', format: 'number' },
                        { key: 'Peers', label: '客户端数', sort: 'peers', align: 'right', format: 'number' },
                        { key: 'Chains', label: '线路数', align: 'right', format: 'number' },
                        { key: 'Download', label: '下载量', sort: 'download', align: 'right', format: 'bytes' },
                        { key: 'Upload', label: '上传量', sort: 'upload', align: 'right', format: 'bytes' },
                        { key: 'Total', label: '总计', sort: 'total', align: 'right', format: 'bytes', strong: true },
                        { key: 'LastSeen', label: '最近访问', sort: 'last', align: 'right', format: 'time' },
                        { key: 'action', label: '明细', format: 'action', width: 'w-20' }
                    ],
                    reload: () => self.loadStats(),
                    onRowClick: item => self.openDetail(item.Target)
                });
                self.loadStats();
            },

            loadStats() {
                this.loading = true;
                const params = new URLSearchParams();
                if (this.startTime) {
                    params.append('startTime', this.startTime);
                }
                if (this.endTime) {
                    params.append('endTime', this.endTime);
                }
                fetch('/api/stats?' + this.mainTable.appendParams(params).toString())
                    .then(response => response.json())
                    .then(data => {
                        this.mainTable.applyResult(data);
                        this.loading = false;
                    })
                    .catch(error => {
                        console.error('加载统计失败:', error);
                        this.error = '加载失败: ' + error.message;
                        this.loading = false;
                    });
            },

            clearFilters() {
                this.startTime = '';
                this.endTime = '';
                // 时间筛选是服务端做的，清空后必须重新请求
                this.loadStats();
            }
        }
    }
</script>
{{end}}
