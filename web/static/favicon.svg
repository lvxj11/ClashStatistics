<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="连接拓扑">
  <rect width="64" height="64" rx="14" fill="#0b1220"/>
  <!-- 中心（本机/网关）与四个终端的连接 -->
  <g stroke="#22c55e" stroke-width="3.5" stroke-linecap="round">
    <line x1="32" y1="32" x2="14" y2="16"/>
    <line x1="32" y1="32" x2="50" y2="16"/>
    <line x1="32" y1="32" x2="14" y2="48"/>
    <line x1="32" y1="32" x2="50" y2="48"/>
  </g>
  <circle cx="32" cy="32" r="8.5" fill="#4ade80"/>
  <g fill="#22c55e">
    <circle cx="14" cy="16" r="5"/>
    <circle cx="50" cy="16" r="5"/>
    <circle cx="14" cy="48" r="5"/>
    <circle cx="50" cy="48" r="5"/>
  </g>
</svg>
