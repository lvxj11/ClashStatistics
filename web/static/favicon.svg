<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Clash Statistics">
  <defs>
    <linearGradient id="bars" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <!-- 底色与页面深色主题一致 -->
  <rect width="64" height="64" rx="14" fill="#0b1220"/>

  <!-- 递增的柱状条：统计 -->
  <rect x="11" y="38" width="9" height="14" rx="3" fill="url(#bars)"/>
  <rect x="27" y="29" width="9" height="23" rx="3" fill="url(#bars)"/>
  <rect x="43" y="19" width="9" height="33" rx="3" fill="url(#bars)"/>

  <!-- 基线 -->
  <rect x="9" y="55" width="46" height="2.5" rx="1.25" fill="#334155"/>
</svg>
