name: Build, Push and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # 手动触发能力（非 tag 时只做构建校验，不发布）

env:
  DOCKER_IMAGE: lvxj11/clash-statistics
  DOCKER_PLATFORMS: linux/amd64,linux/arm64

# 同一 ref 上重复触发时取消尚未结束的旧运行：
# 连续推多个 tag 不会互相覆盖，也不会堆积出多余的运行
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # ---------- 校验与二进制 ----------
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          # 版本号以 go.mod 为准，避免两处重复维护
          go-version-file: go.mod
          # 取该版本线下的最新补丁版（例如 1.27.0 -> 1.27.3），无需手动跟进
          check-latest: true
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未执行 gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build binaries
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/clash-statistics-linux-amd64 .
          GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/clash-statistics-linux-arm64 .
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/clash-statistics-windows-amd64.exe .

      # ---------- 发布 Release（仅 tag） ----------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3.0.3
        with:
          # 原来用 github.ref，手动触发时会拿分支名当 tag，这里改用 ref_name
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/clash-statistics-linux-amd64
            dist/clash-statistics-linux-arm64
            dist/clash-statistics-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------- 镜像（放在最后，避免 Release 失败时镜像已推送导致两者不一致） ----------
      - name: Set up QEMU
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to Docker Hub
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata for Docker
        if: startsWith(github.ref, 'refs/tags/')
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push Docker image
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
