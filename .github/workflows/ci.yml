name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 连续推送时自动取消被后续提交取代的旧运行，不会堆积出多余的运行；
# 公开仓库的 Actions 分钟是免费的，可以放心在每次提交时校验
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          # 取该版本线下的最新补丁版（例如 1.27.0 -> 1.27.3），无需手动跟进
          check-latest: true
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未执行 gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        env:
          CGO_ENABLED: 0
        run: go build ./...
